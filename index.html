<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101414">
  <title>DELTA X — Quản lý sản xuất CNC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg: #101414;
      --panel: #171d1c;
      --panel-raised: #1c2322;
      --panel-soft: #202827;
      --line: #2b3532;
      --text: #edf2eb;
      --muted: #8d9991;
      --accent: #c7f36b;
      --accent-dark: #9fcb4a;
      --cyan: #66d6c5;
      --amber: #f0b968;
      --red: #f07869;
      --radius: 16px;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 360px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 68% -12%, rgba(116, 153, 82, .11), transparent 34%),
        var(--bg);
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app-shell { min-height: 100vh; }
    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 42px;
      border-bottom: 1px solid rgba(148, 166, 151, .13);
      background: rgba(16, 20, 20, .92);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
    .brand-mark { width: 36px; height: 36px; display: block; overflow: hidden; border-radius: 10px; background: #101413; }
    .brand-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .brand-name { font: 800 24px/1 "Barlow Condensed", sans-serif; letter-spacing: 2px; }
    .brand-sub { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 1.65px; }
    .topbar-right { display: flex; align-items: center; gap: 24px; }
    .plant-status { display: flex; align-items: center; gap: 8px; color: #bac5bc; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(199, 243, 107, .6); }
    .user-chip { display: flex; align-items: center; gap: 9px; padding-left: 20px; border-left: 1px solid var(--line); font-size: 12px; color: #d3dbd1; }
    .user-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #303e34; color: var(--accent); font-size: 11px; font-weight: 700; }
    .page-wrap { width: min(1280px, calc(100% - 72px)); margin: 0 auto; padding: 44px 0 64px; }
    .breadcrumb { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; margin-bottom: 24px; }
    .breadcrumb .breadcrumb-link { border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; }
    .breadcrumb .breadcrumb-link:hover { color: var(--accent); }
    .breadcrumb .back-button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; margin-right: 7px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: #dce5d8; font-size: 11px; font-weight: 600; transition: .18s ease; }
    .breadcrumb .back-button:hover { border-color: #69795b; background: var(--panel-raised); color: var(--accent); }
    .breadcrumb .back-button svg { width: 14px; height: 14px; }
    .breadcrumb .current { color: #dce5d8; }
    .eyebrow { color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font: 600 clamp(32px, 4vw, 46px)/1.08 "Barlow Condensed", sans-serif; letter-spacing: .3px; }
    h2 { margin-bottom: 7px; font: 600 26px/1.1 "Barlow Condensed", sans-serif; }
    .page-description { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 0; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
    .heading-copy { max-width: 670px; }
    .heading-copy .eyebrow { margin-bottom: 12px; }
    .button {
      min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      border: 1px solid transparent; border-radius: 9px; padding: 0 16px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: .18s ease;
    }
    .button svg { width: 16px; height: 16px; }
    .button-primary { background: var(--accent); color: #182012; }
    .button-primary:hover { background: #d5ff82; transform: translateY(-1px); }
    .button-secondary { border-color: var(--line); background: var(--panel); color: #dce4db; }
    .button-secondary:hover { border-color: #62705f; background: var(--panel-raised); }
    .button-quiet { border: 0; background: transparent; color: var(--muted); padding: 0 9px; }
    .button-quiet:hover { color: var(--text); background: rgba(255,255,255,.04); }

    .hero {
      position: relative; overflow: hidden; min-height: 270px; display: flex; align-items: center;
      padding: 44px 50px; border: 1px solid #354033; border-radius: 18px;
      background: linear-gradient(110deg, #1d2722 0%, #1b2420 54%, #253126 100%);
      margin-bottom: 38px;
    }
    .hero::after {
      content: ""; position: absolute; width: 500px; height: 500px; right: 2%; top: -118px;
      border: 1px solid rgba(199, 243, 107, .10); border-radius: 50%;
      box-shadow: 0 0 0 34px rgba(199,243,107,.025), 0 0 0 72px rgba(199,243,107,.025), 0 0 0 110px rgba(199,243,107,.02);
    }
    .hero-content { position: relative; z-index: 1; max-width: 600px; }
    .hero .eyebrow { margin-bottom: 16px; }
    .hero h1 { font-size: clamp(36px, 5vw, 54px); max-width: 560px; }
    .hero p { color: #a7b3a7; font-size: 13px; line-height: 1.75; max-width: 470px; margin: 0; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .section-heading h2 { margin: 0; font-size: 22px; }
    .section-kicker { color: var(--muted); font-size: 11px; }
    .module-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .module-card {
      min-height: 210px; padding: 21px; text-align: left; position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(150deg, #1a211f, #171d1c);
      cursor: pointer; transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .module-card:hover { transform: translateY(-4px); border-color: #58664f; background: linear-gradient(150deg, #202922, #191f1e); }
    .module-card.featured { border-color: #48583b; background: linear-gradient(145deg, #202a20, #191f1d); }
    .module-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .module-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid #3b4738; border-radius: 11px; color: var(--accent); background: rgba(199,243,107,.07); }
    .module-icon svg { width: 21px; height: 21px; }
    .module-arrow { color: #68756a; font-size: 18px; transition: .2s; }
    .module-card:hover .module-arrow { transform: translate(3px,-3px); color: var(--accent); }
    .module-count { color: #9bab98; font: 600 13px "Barlow Condensed", sans-serif; }
    .module-card h3 { margin: 21px 0 7px; font: 600 20px "Barlow Condensed", sans-serif; letter-spacing: .25px; }
    .module-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .dashboard-lower { display: grid; grid-template-columns: 1.35fr .85fr; gap: 16px; margin-top: 32px; }
    .info-panel { border: 1px solid var(--line); border-radius: 13px; background: var(--panel); padding: 20px; }
    .info-panel h3 { margin: 0; font: 600 18px "Barlow Condensed", sans-serif; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }
    .muted-tag { padding: 5px 8px; border-radius: 6px; background: #242d29; color: #a5b1a6; font-size: 10px; }
    .quick-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid #28312e; font-size: 12px; }
    .quick-row:first-of-type { border-top: 0; }
    .quick-name { color: #d8e0d6; font-weight: 600; }
    .quick-sub { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .quick-number { font: 600 18px "Barlow Condensed", sans-serif; }
    .empty-note { padding: 13px 0 4px; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .plan-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 17px; }
    .summary-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid #303a35; border-radius: 7px; color: #b6c0b7; font-size: 10px; }
    .summary-chip strong { color: var(--text); font-size: 11px; }
    .plan-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .plan-card { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .plan-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .plan-month { font: 600 21px "Barlow Condensed", sans-serif; }
    .plan-year { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .plan-total { text-align: right; color: var(--accent); font: 700 22px "Barlow Condensed", sans-serif; }
    .plan-total small { display: block; color: var(--muted); font: 400 9px "DM Sans", sans-serif; }
    .plan-progress { height: 4px; overflow: hidden; margin: 16px 0 12px; background: #303934; border-radius: 99px; }
    .plan-progress span { height: 100%; display: block; border-radius: inherit; background: var(--accent); }
    .plan-product-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .plan-product-pill { padding: 5px 8px; border-radius: 6px; background: #242c28; color: #c4cec4; font-size: 10px; }
    .plan-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
    .plan-card-foot .subtle { color: var(--muted); font-size: 10px; }
    .plan-actions { display: flex; align-items: center; gap: 12px; }
    .button-danger { min-height: 36px; border-color: #593934; background: rgba(240,120,105,.07); color: #ef9689; padding: 0 11px; font-size: 10px; }
    .button-danger:hover { border-color: var(--red); background: rgba(240,120,105,.15); color: #ffb0a5; }
    .danger-link { border: 0; padding: 5px 0; background: transparent; color: #d78376; font-size: 10px; cursor: pointer; }
    .danger-link:hover { color: #ff9a8b; }
    .text-link { border: 0; padding: 0; background: none; color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer; }
    .product-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 25px; }
    .product-tile {
      min-height: 122px; display: flex; flex-direction: column; justify-content: space-between; text-align: left;
      padding: 15px; border: 1px solid var(--line); border-radius: 12px;
      background: linear-gradient(150deg, #202824, #171d1c); cursor: pointer; transition: .18s;
    }
    .product-tile:hover, .product-tile.selected { border-color: var(--accent-dark); background: linear-gradient(150deg, #283522, #1c241d); }
    .product-glyph { color: var(--accent); font: 700 10px "Barlow Condensed", sans-serif; letter-spacing: 1.2px; }
    .product-tile strong { font: 600 24px "Barlow Condensed", sans-serif; }
    .product-tile small { color: #aab6ab; font-size: 10px; }
    .detail-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: -5px 0 16px; }
    .detail-tab { min-width: 120px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: #aab6ac; font-size: 11px; font-weight: 700; cursor: pointer; }
    .detail-tab:hover { border-color: #62705f; color: var(--text); }
    .detail-tab.selected { border-color: var(--accent-dark); background: #232d20; color: var(--accent); }
    .detail-tab small { color: var(--muted); font-size: 9px; font-weight: 500; }
    .refining-table { min-width: 780px; }
    .process-checkbox { width: 16px; height: 16px; accent-color: var(--accent-dark); cursor: pointer; }
    .process-choice { display: inline-flex; align-items: center; gap: 7px; color: #bac5bb; white-space: nowrap; }
    .process-disabled { color: #748078; font-size: 10px; }
    .table-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .table-toolbar { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .table-toolbar h3 { margin: 0; font: 600 18px "Barlow Condensed", sans-serif; }
    .table-toolbar small { color: var(--muted); font-size: 10px; }
    .table-toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .draft-controls { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .draft-status { color: var(--amber); font-size: 9px; white-space: nowrap; }
    .draft-controls .button { min-height: 34px; padding: 0 11px; font-size: 10px; }
    .draft-controls .button:disabled { border-color: var(--line); background: #202624; color: #78837b; cursor: default; transform: none; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 1080px; border-collapse: collapse; text-align: left; }
    thead { background: #1b2220; }
    th { padding: 11px 10px; color: #9eaaa0; font-size: 9px; font-weight: 700; letter-spacing: .65px; white-space: nowrap; text-transform: uppercase; }
    td { padding: 9px 10px; border-top: 1px solid #29312e; color: #d5ded3; font-size: 11px; vertical-align: middle; }
    tbody tr:hover { background: rgba(255,255,255,.018); }
    tbody tr.row-complete { background: rgba(91, 190, 128, .075); }
    tbody tr.row-complete:hover { background: rgba(91, 190, 128, .12); }
    tbody tr.row-complete td:first-child { box-shadow: inset 3px 0 0 #53cb83; }
    td:first-child, th:first-child { padding-left: 15px; }
    .row-number { color: #89978b; font: 500 13px "Barlow Condensed", sans-serif; }
    .cell-input, .cell-select, .cell-note {
      min-width: 80px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 6px;
      outline: none; background: transparent; color: #dce4db; font-size: 10px;
    }
    .cell-input { text-align: right; }
    .cell-input:hover, .cell-select:hover, .cell-note:hover { border-color: #3a4740; }
    .cell-input:focus, .cell-select:focus, .cell-note:focus { border-color: #728c52; background: #202823; }
    .cell-select { min-width: 104px; appearance: none; background-color: #202723; }
    .cell-name { min-width: 150px; color: #cbd6cc; }
    .aluminum { color: var(--cyan); font-family: "Barlow Condensed", sans-serif; font-size: 13px; white-space: nowrap; }
    .calculated { color: var(--accent); font: 600 14px "Barlow Condensed", sans-serif; text-align: right; }
    .group-total { color: #eff5e9; font: 700 14px "Barlow Condensed", sans-serif; text-align: right; }
    .completion-cell { min-width: 190px; display: flex; align-items: center; gap: 5px; }
    .completion-cell .cell-input { flex: 1; }
    .max-button { flex: 0 0 auto; padding: 4px 6px; border: 1px solid #49573d; border-radius: 5px; background: rgba(199,243,107,.07); color: var(--accent); font-size: 8px; font-weight: 800; cursor: pointer; }
    .max-button:hover:not(:disabled) { background: rgba(199,243,107,.16); }
    .max-button:disabled { opacity: .4; cursor: default; }
    .max-all-button { min-height: 34px; padding: 0 11px; border: 1px solid #34718a; border-radius: 7px; background: rgba(66,166,205,.14); color: #8cdef8; font-size: 9px; font-weight: 800; letter-spacing: .35px; white-space: nowrap; cursor: pointer; transition: .16s ease; }
    .max-all-button:hover:not(:disabled) { border-color: #58a7c3; background: rgba(66,166,205,.24); }
    .max-all-button:disabled { opacity: .45; cursor: default; }
    .completion-status { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border: 1px solid #30794f; border-radius: 99px; color: #83e7a9; background: rgba(53, 161, 98, .16); font-size: 9px; font-weight: 700; white-space: nowrap; }
    .completion-status svg { width: 12px; height: 12px; }
    .completion-pending { color: #718078; font-size: 9px; white-space: nowrap; }
    .table-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .legend-dot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--accent); }
    .notice { margin-top: 12px; padding: 11px 13px; border: 1px solid #394034; border-radius: 8px; color: #b5c2b2; background: rgba(199,243,107,.045); font-size: 10px; line-height: 1.6; }
    .notice strong { color: var(--accent); }
    .blank-state { padding: 54px 24px; border: 1px dashed #35403a; border-radius: 12px; color: var(--muted); text-align: center; background: rgba(255,255,255,.012); }
    .blank-state-icon { display: grid; place-items: center; width: 46px; height: 46px; margin: 0 auto 15px; border-radius: 13px; color: var(--accent); background: #252e25; }
    .blank-state h3 { margin-bottom: 6px; color: #e2e8de; font: 600 20px "Barlow Condensed", sans-serif; }
    .blank-state p { margin-bottom: 18px; font-size: 11px; line-height: 1.6; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(5,8,7,.76); backdrop-filter: blur(5px); }
    .modal { width: min(510px, 100%); max-height: min(90vh, 760px); overflow-y: auto; border: 1px solid #3a453c; border-radius: 15px; background: #171e1b; box-shadow: 0 25px 90px rgba(0,0,0,.45); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 22px 23px 17px; border-bottom: 1px solid var(--line); }
    .modal-head .eyebrow { margin-bottom: 7px; font-size: 9px; }
    .modal-head h2 { margin: 0; font-size: 23px; }
    .close-button { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: #a8b2a8; background: #202724; font-size: 18px; cursor: pointer; }
    .close-button:hover { color: var(--text); border-color: #596552; }
    .modal-body { padding: 20px 23px 22px; }
    .form-label { display: block; margin-bottom: 7px; color: #c7d0c7; font-size: 11px; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-bottom: 18px; }
    .field input, .field select {
      width: 100%; height: 41px; padding: 0 11px; border: 1px solid #343e39; border-radius: 7px;
      outline: none; background: #202724; color: var(--text); font-size: 12px;
    }
    .field input:focus, .field select:focus { border-color: #7a9551; }
    .quantity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quantity-field { margin-bottom: 0; }
    .quantity-field label { display: flex; justify-content: space-between; color: #bfc9bf; font-size: 10px; }
    .quantity-field label span { color: #7d8b7f; }
    .xs-variant-list { display: grid; gap: 9px; margin-bottom: 16px; }
    .xs-variant-row { display: grid; grid-template-columns: 82px minmax(100px, 1fr) minmax(120px, 1fr); align-items: end; gap: 10px; padding: 10px; border: 1px solid #2d3732; border-radius: 8px; background: #1b221f; }
    .xs-variant-name { align-self: center; color: #dce5da; font: 600 16px "Barlow Condensed", sans-serif; }
    .xs-variant-name small { display: block; margin-top: 3px; color: var(--muted); font: 500 9px "DM Sans", sans-serif; letter-spacing: .6px; }
    .xs-variant-row .field { margin: 0; }
    .xs-variant-row .form-label { margin-bottom: 5px; font-size: 9px; }
    .xs-variant-row input, .xs-variant-row select { height: 35px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
    .machine-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 15px; }
    .machine-card { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(155deg, #1d2521, #171d1c); }
    .machine-head { display: flex; align-items: flex-start; justify-content: space-between; }
    .machine-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 9px; color: var(--cyan); background: rgba(102,214,197,.08); }
    .machine-icon svg { width: 20px; height: 20px; }
    .machine-card h3 { margin: 14px 0 4px; font: 600 21px "Barlow Condensed", sans-serif; }
    .machine-card p { margin-bottom: 14px; color: var(--muted); font-size: 10px; }
    .machine-card .field { margin: 0; }
    .machine-card .field select { height: 36px; font-size: 10px; }
    .machine-part-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 17px 0 9px; padding-top: 13px; border-top: 1px solid var(--line); }
    .machine-part-heading strong { color: #dce5dc; font: 600 14px "Barlow Condensed", sans-serif; letter-spacing: .4px; }
    .machine-part-heading span { color: var(--muted); font-size: 9px; }
    .machine-part-table { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
    .machine-part-table-head, .machine-part-row { display: grid; grid-template-columns: minmax(0, 1fr) 94px 58px; align-items: center; gap: 8px; }
    .machine-part-table-head { padding: 8px 9px; color: #8d9d91; background: rgba(255,255,255,.025); font-size: 8px; font-weight: 700; letter-spacing: .45px; }

    let hasLegacyLocalState = false;
    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (parsed && Array.isArray(parsed.plans)) {
          hasLegacyLocalState = true;
          return parsed;
        }
      } catch (error) {
        console.warn("Không thể đọc dữ liệu kế hoạch đã lưu.", error);
      }
      return { plans: [], allocations: {}, bom: null };
    }
    function migrateState(target) {
      let migrated = false;
      const version = Number(target.bomVersion || 0);
      if (version < 2) {
        if (target.bom) {
          if (target.bom.XS) {
            delete target.bom.XS;
            migrated = true;
          }
          XS_VARIANTS.forEach(variant => {
            if (target.bom[variant.key]) {
              delete target.bom[variant.key];
              migrated = true;
            }
          });
        }
        target.plans.forEach(plan => {
          XS_VARIANTS.forEach(variant => {
            if (plan.progress?.[variant.key]) {
              plan.archivedSampleProgress = plan.archivedSampleProgress || {};
              plan.archivedSampleProgress[variant.key] = plan.progress[variant.key];
              delete plan.progress[variant.key];
              migrated = true;
            }
          });
        });
        target.bomVersion = 2;
        migrated = true;
      }
      if (Number(target.bomVersion || 0) < 3) {
        if (target.bom) {
          ["X3", "X2"].forEach(product => {
            if (target.bom[product]) {
              delete target.bom[product];
              migrated = true;
            }
          });
        }
        target.plans.forEach(plan => {
          ["X3", "X2"].forEach(product => {
            if (plan.progress?.[product]) {
              plan.archivedSampleProgress = plan.archivedSampleProgress || {};
              plan.archivedSampleProgress[product] = plan.progress[product];
              delete plan.progress[product];
              migrated = true;
            }
          });
        });
        target.bomVersion = 3;
        migrated = true;
      }
      target.plans.forEach(plan => {
        plan.quantities = plan.quantities || {};
        if (Object.prototype.hasOwnProperty.call(plan.quantities, "XS")) {
          if (!Object.prototype.hasOwnProperty.call(plan.quantities, "XS_D800")) {
            plan.quantities.XS_D800 = Number(plan.quantities.XS || 0);
          }
          delete plan.quantities.XS;
          migrated = true;
        }
        if (Object.prototype.hasOwnProperty.call(plan.quantities, "Smart")) {
          delete plan.quantities.Smart;
          migrated = true;
        }
        plan.axes = plan.axes || {};
        XS_VARIANTS.forEach(variant => {
          if (!["4 trục", "5 trục", "6 trục"].includes(plan.axes[variant.key])) {
            plan.axes[variant.key] = "4 trục";
            migrated = true;
          }
        });
        if (plan.progress?.XS && !plan.progress.XS_D800) {
          plan.progress.XS_D800 = plan.progress.XS;
          delete plan.progress.XS;
          migrated = true;
        }
        if (plan.progress?.Smart) {
          delete plan.progress.Smart;
          migrated = true;
        }
      });
      target.allocations = target.allocations || {};
      Object.keys(target.allocations).forEach(machine => {
        if (target.allocations[machine] === "XS") {
          target.allocations[machine] = "XS_D800";
          migrated = true;
        } else if (target.allocations[machine] === "Smart") {
          delete target.allocations[machine];
          migrated = true;
        }
      });
      if (target.bom?.XS && !target.bom.XS_D800) {
        target.bom.XS_D800 = target.bom.XS;
        migrated = true;
      }
      if (target.bom?.XS) delete target.bom.XS;
      if (target.bom?.Smart) {
        delete target.bom.Smart;
        migrated = true;
      }
      return migrated;
    }

    function ensureInventoryState(target) {
      if (!target.inventory || typeof target.inventory !== "object") target.inventory = {};
      if (!Array.isArray(target.inventory.aluminumReceipts)) target.inventory.aluminumReceipts = [];
      if (!Array.isArray(target.inventory.shipments)) target.inventory.shipments = [];
    }
    let state = loadState();
    ensureInventoryState(state);
    let stateMigrated = migrateState(state);
    function applySavedBom(target) {
      if (!target.bom) return;
      Object.keys(PRODUCT_BOM).forEach(product => {
        const savedRows = target.bom[product];
        if (!Array.isArray(savedRows)) return;
        PRODUCT_BOM[product].forEach((part, index) => {
          const saved = product === "Băng tải XS"
            ? savedRows.find(row => row?.common === part.common)
            : savedRows[index];
          if (!part || !saved || typeof saved !== "object") return;
          ["aluminum", "common", "cad"].forEach(key => {
            if (typeof saved[key] === "string") part[key] = saved[key];
          });
          ["perUnit", "blank"].forEach(key => {
            if (Number.isFinite(saved[key]) && saved[key] >= 0) part[key] = saved[key];
          });
        });
      });
    }
    applySavedBom(state);
    state.bom = PRODUCT_BOM;
    state.bomVersion = 3;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn("Không thể lưu bản sao dự phòng trên trình duyệt.", error);
      }
      if (databaseReady && currentUser && ["editor", "admin"].includes(currentUser.role)) {
        const snapshot = JSON.stringify(state);
        databaseWriteQueue = databaseWriteQueue.then(async () => {
          const response = await fetch(`${API_BASE}/api/state`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ state: JSON.parse(snapshot), expectedRevision: databaseRevision })
          });
          const result = await response.json();
          if (!response.ok) {
            const error = new Error(result.error || `Database save failed (${response.status}).`);
            error.status = response.status;
            throw error;
          }
          databaseRevision = result.revision;
        }).catch(error => {
          databaseReady = false;
          console.error("Không thể lưu dữ liệu vào cơ sở dữ liệu.", error);
          showDatabaseError(error.status === 409
            ? "Có người khác vừa cập nhật dữ liệu. Tải lại trang để nhận bản mới nhất trước khi tiếp tục."
            : error.status === 403
              ? "Tài khoản của bạn không có quyền ghi dữ liệu. Hãy đăng xuất rồi đăng nhập lại."
              : "Không thể lưu dữ liệu lên máy chủ. Hãy kiểm tra kết nối rồi thử tải lại trang.");
        });
      }
    }
    async function initializeDatabase() {
      const app = document.getElementById("app");
      app.innerHTML = `<section class="blank-state" style="margin-top:12vh"><span class="blank-state-icon">${icons.calendar}</span><h3>Đang kết nối</h3><p>Đang xác thực tài khoản và tải dữ liệu sản xuất...</p></section>`;
      try {
        const sessionResponse = await fetch(`${API_BASE}/api/auth/session`, { cache: "no-store" });
        if (!sessionResponse.ok) throw new Error(`Authentication check failed (${sessionResponse.status}).`);
        const session = await sessionResponse.json();
        currentUser = session.user;
        storageMode = session.storageMode || "sqlite";
        if (!currentUser) {
          databaseReady = false;
          const setupResponse = await fetch(`${API_BASE}/api/auth/setup`, { cache: "no-store" });
          if (!setupResponse.ok) throw new Error(`Authentication setup failed (${setupResponse.status}).`);
          authSetup = await setupResponse.json();
          renderAuthPage("login");
          return;
        }

        const response = await fetch(`${API_BASE}/api/state`, { cache: "no-store" });
        if (response.status === 401) {
          currentUser = null;
          databaseReady = false;
          authSetup = await (await fetch(`${API_BASE}/api/auth/setup`, { cache: "no-store" })).json();
          renderAuthPage("login", "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
          return;
        }
        if (!response.ok) throw new Error(`Database connection failed (${response.status}).`);
        const result = await response.json();
        databaseRevision = Number(result.revision || 0);
        const hasDatabaseState = Boolean(result.state);
        if (hasDatabaseState) {
          state = result.state;
          state.plans = Array.isArray(state.plans) ? state.plans : [];
          state.allocations = state.allocations || {};
          ensureInventoryState(state);
          const databaseMigrated = migrateState(state);
          applySavedBom(state);
          state.bom = PRODUCT_BOM;
          state.bomVersion = 3;
          stateMigrated = stateMigrated || databaseMigrated;
        } else if (hasLegacyLocalState && ["editor", "admin"].includes(currentUser.role)) {
          const importResponse = await fetch(`${API_BASE}/api/state`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ state, expectedRevision: 0 })
          });
          if (!importResponse.ok) throw new Error(`Không thể nhập dữ liệu trình duyệt (${importResponse.status}).`);
          const imported = await importResponse.json();
          databaseRevision = imported.revision;
          showToast("Đã nhập dữ liệu cũ vào SQLite.");
        } else if (!hasDatabaseState) {
          state = { plans: [], allocations: {}, bom: null };
          ensureInventoryState(state);
          applySavedBom(state);
          state.bom = PRODUCT_BOM;
          state.bomVersion = 3;
        }
        databaseReady = true;
        if ((hasDatabaseState || hasLegacyLocalState) && stateMigrated && ["editor", "admin"].includes(currentUser.role)) saveState();
        renderDashboard();
      } catch (error) {
        databaseReady = false;
        console.error("Không thể kết nối máy chủ hoặc cơ sở dữ liệu.", error);
        showDatabaseError("Không thể kết nối máy chủ hoặc cơ sở dữ liệu. Hãy thử lại khi kết nối ổn định.");
      }

    function stagePlanEdit(planId, product, section, index, field, value, rerender = false, input = null) {

      const edit = { planId, product, section, index, field, value };
      const key = pendingEditKey(planId, product, section, index, field);
      const persistedValue = persistedPlanEditValue(plan, edit);
      let unchanged = field === "completed"
        ? String(value).trim() !== "" && Number(value) === Number(persistedValue || 0)
        : field === "enabled"
          ? Boolean(value) === Boolean(persistedValue)

      if (field === "completed" && String(value).trim() !== "") {

      }
      const prepared = [];
      for (const [key, edit] of entries) {
        let value = edit.value;
        if (edit.field === "completed") {
          if (String(value).trim() === "") {
            showToast("Số lượng hoàn thành không được để trống.");
            return;
          }
          value = Number(value);
          if (!Number.isInteger(value) || value < 0) {

            return;

      return (PRODUCT_BOM[product] || []).map((part, index) => {
        const source = variant ? XS_BOM[index] : part;
      const perUnit = variant && source.axis ? 1 : part.perUnit;
      const blank = part.blank;
      return {
        ...part,
        index,
        perUnit: Number(perUnit || 0),
        blank: Number(blank || 0),
        planned: units * Number(perUnit || 0),
        blankTotal: units * Number(perUnit || 0) * Number(blank || 0),
        completed: Number(progress[index]?.completed || 0),
        type: progress[index]?.type || "Tự gia công",
        note: progress[index]?.note || source.note || ""

    function calculateGroupBlankTotals(rows) {
      const groups = {};

        if (!row.aluminum || row.blankTotal <= 0) return;
        const group = groups[row.aluminum] || (groups[row.aluminum] = { total: 0, shared: {} });
        group.total += row.blankTotal;
        if (row.sharedStockGroup) {
          const shared = group.shared[row.sharedStockGroup] || (group.shared[row.sharedStockGroup] = []);
          shared.push(row.blankTotal);
        }
      });
      return Object.fromEntries(Object.entries(groups).map(([aluminum, group]) => {

    function savePlan(event, editId) {
      event.preventDefault();
      const form = event.currentTarget;
      const month = Number(form.elements.month.value);
      const year = Number(form.elements.year.value);
      const quantities = {};
      PRODUCT_NAMES.forEach(product => { quantities[product] = Number(form.elements[`quantity-${product}`].value || 0); });
      const axes = {};
      XS_VARIANTS.forEach(variant => { axes[variant.key] = form.elements[`axis-${variant.key}`].value; });
      if (!Number.isInteger(year) || year < 2020 || year > 2100 || Object.values(quantities).some(value => !Number.isInteger(value) || value < 0)) {
        showToast("Vui lòng kiểm tra tháng, năm và số lượng sản phẩm.");
        return;
      }
      const conflict = state.plans.find(plan => plan.month === month && plan.year === year && plan.id !== editId);
      if (conflict) {
        showToast("Tháng này đã có kế hoạch. Hãy mở kế hoạch hiện có để chỉnh sửa.");
        return;
      }
      if (editId) {
        const plan = getPlan(editId);
        if (hasPendingEdits(editId)) {
          showToast("Kế hoạch đang có thay đổi chưa cập nhật. Hãy cập nhật dữ liệu trước.");
          return;
        }
        if (plan && hasShipmentForPlan(editId)) {
          showToast("Không thể sửa kế hoạch đã bàn giao để bảo toàn lịch sử đối chiếu.");
          return;
        }
        if (plan) {
          plan.quantities = quantities;
          plan.axes = axes;
        }
      } else {
        state.plans.push({ id: `plan-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, month, year, quantities, axes, progress: {} });
      }
      saveState();
      closeModal();
      showToast(editId ? "Kế hoạch đã được cập nhật." : "Kế hoạch tháng đã được tạo.");

    function planProductionRows(plan) {
      return productsForPlan(plan).flatMap(product => getRows(plan, product).map(row => ({
        ...row,
        productKey: product,
        productLabel: productLabel(product, plan)
      })));
    }
    function planReadyForHandover(plan) {
      const rows = planProductionRows(plan);
      return rows.length > 0 && rows.every(row => {
        if (row.planned <= 0 || row.completed < row.planned) return false;
        return ["taro", "deburr"].every(process => {
          const progress = plan.refining?.[row.productKey]?.[row.index]?.[process];
          return !progress?.enabled || Number(progress.completed || 0) >= row.planned;
        });
      });
    }
    function planHandoverItems(plan) {
      return planProductionRows(plan).filter(row => row.planned > 0).map(row => ({
        productKey: row.productKey,
        product: row.productLabel,
        partIndex: row.index,
        stt: row.stt || row.index + 1,
        common: row.common,
        aluminum: row.aluminum,
        quantity: row.planned
      }));
    }
    function hasShipmentForPlan(planId) {
      ensureInventoryState(state);
      return state.inventory.shipments.some(shipment => shipment.planId === planId);
    }
    function shipmentSourceKey(planId, productKey, partIndex) {
      return `${planId}\u0000${productKey}\u0000${partIndex}`;
    }
    function finishedStockRows() {
      ensureInventoryState(state);
      const stock = new Map();
      const shippedBySource = new Map();
      state.inventory.shipments.forEach(shipment => {
        (shipment.items || []).forEach(item => {
          const key = shipmentSourceKey(shipment.planId, item.productKey, item.partIndex);
          shippedBySource.set(key, (shippedBySource.get(key) || 0) + Number(item.quantity || 0));
        });
      });
      state.plans.forEach(plan => {
        productsForPlan(plan).forEach(product => {
          const label = productLabel(product, plan);
          const rows = getRows(plan, product);
          rows.forEach(row => {
            let completed = Math.min(Math.max(row.completed, 0), row.planned);
            ["taro", "deburr"].forEach(process => {
              const processProgress = plan.refining?.[product]?.[row.index]?.[process];
              if (processProgress?.enabled) {
                completed = Math.min(completed, Math.max(Number(processProgress.completed || 0), 0));
              }
            });
            completed = Math.max(completed - (shippedBySource.get(shipmentSourceKey(plan.id, product, row.index)) || 0), 0);
            if (completed <= 0) return;
            const key = `${label}\u0000${row.index}`;
            const item = stock.get(key) || { product: label, common: row.common, stt: row.stt || row.index + 1, quantity: 0 };
            item.quantity += completed;
            stock.set(key, item);
          });
        });
      });
      return [...stock.values()].sort((a, b) => a.product.localeCompare(b.product, "vi") || a.stt - b.stt);

        <div class="notice"><strong>Quy tắc nhập kho tự động:</strong> Số lượng thành phẩm là phần giao nhau giữa số đã gia công CNC và số đã hoàn thành ở từng công đoạn đang được đánh dấu áp dụng. Linh kiện được nhóm riêng theo sản phẩm và tên chi tiết.</div>`;

    function saveShipment(event) {

    function crc32(bytes) {
      let crc = 0xFFFFFFFF;

    function zipStoredFiles(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      for (const file of files) {
        const name = encoder.encode(file.name);
        const data = encoder.encode(file.content);
        const checksum = crc32(data);
        const local = new Uint8Array(30 + name.length);
        const localView = new DataView(local.buffer);
        localView.setUint32(0, 0x04034B50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0x0800, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, 0, true);
        localView.setUint16(12, 0x0021, true);
        localView.setUint32(14, checksum, true);
        localView.setUint32(18, data.length, true);
        localView.setUint32(22, data.length, true);
        localView.setUint16(26, name.length, true);
        local.set(name, 30);
        localParts.push(local, data);

        const central = new Uint8Array(46 + name.length);
        const centralView = new DataView(central.buffer);
        centralView.setUint32(0, 0x02014B50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0x0800, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, 0, true);
        centralView.setUint16(14, 0x0021, true);
        centralView.setUint32(16, checksum, true);
        centralView.setUint32(20, data.length, true);
        centralView.setUint32(24, data.length, true);
        centralView.setUint16(28, name.length, true);
        centralView.setUint16(30, 0, true);
        centralView.setUint16(32, 0, true);
        centralView.setUint16(34, 0, true);
        centralView.setUint16(36, 0, true);
        centralView.setUint32(38, 0, true);
        centralView.setUint32(42, offset, true);
        central.set(name, 46);
        centralParts.push(central);
        offset += local.length + data.length;
      }
      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054B50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, offset, true);
      return new Blob([...localParts, ...centralParts, end], {
        type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      });
    }

      const cards = [1, 2, 3, 4].map(number => {
        const selected = state.allocations[`CNC-${number}`] || "";
        const parts = CNC_MACHINE_PARTS.filter(part => part.machines.includes(number));
        const renderPartRow = (part, index) => `<div class="machine-part-row">
          <div class="machine-part-detail"><span class="machine-part-stt">${String(index + 1).padStart(2, "0")}</span><span class="machine-part-name">${escapeHtml(part.name)}</span></div>
          <span class="machine-part-empty">—</span><span class="machine-part-empty">—</span>
        </div>`;
        const previewRows = parts.slice(0, 5).map((part, index) => renderPartRow(part, index)).join("");
        const extraParts = parts.slice(5);
        const extraRows = extraParts.map((part, index) => renderPartRow(part, index + 5)).join("");
        const expandControl = extraParts.length
          ? `<details class="machine-parts-expander"><summary><span class="machine-expand-more">Xem thêm ${extraParts.length} chi tiết</span><span class="machine-expand-less">Thu gọn danh sách</span></summary>${extraRows}</details>`
          : `<div class="machine-parts-complete">Đã hiển thị toàn bộ danh sách</div>`;
        return `<article class="machine-card"><div class="machine-head"><span class="machine-icon">${icons.machine}</span><span class="muted-tag">${parts.length} CHI TIẾT</span></div><h3>Máy CNC-${String(number).padStart(2, "0")}</h3><p>Chi tiết được phân công theo danh sách của xưởng</p>
          <div class="field"><label class="form-label" for="machine-${number}">Sản phẩm trong kế hoạch</label><select id="machine-${number}" onchange="allocateMachine(${number},this.value)"><option value="">Chưa phân bổ sản phẩm</option>${currentProducts.map(product => `<option value="${escapeHtml(product)}" ${selected === product ? "selected" : ""}>${escapeHtml(productLabel(product, latestPlan))}</option>`).join("")}</select></div>
          <div class="machine-part-heading"><strong>LINH KIỆN GIA CÔNG</strong><span>${parts.length} chi tiết</span></div>
          <div class="machine-part-table"><div class="machine-part-table-head"><span>STT · TÊN CHI TIẾT</span><span>THỜI GIAN / 1 CHI TIẾT</span><span>GHI CHÚ</span></div>${previewRows}${expandControl}</div>
        </article>`;
      }).join("");
      const body = `${breadcrumb([{ label: "Tổng quan", action: "navigate('dashboard')" }, { label: "Máy CNC" }])}
        <div class="page-heading"><div class="heading-copy"><div class="eyebrow">ĐIỀU PHỐI · PHÂN BỔ SẢN XUẤT</div><h1>Máy CNC</h1><p class="page-description">${sourceRowCount} dòng phân công từ danh sách của xưởng, sắp xếp theo từng máy. Bạn vẫn có thể gán sản phẩm từ kế hoạch cho từng máy.</p></div><span class="muted-tag">${currentProducts.length ? `${currentProducts.length} SẢN PHẨM TRONG KẾ HOẠCH` : "CHƯA CÓ KẾ HOẠCH"}</span></div>
        <section class="machine-grid">${cards}</section>
        <div class="notice">Dòng 14 và 41 trong ảnh gốc được gộp vì trùng tên chi tiết và máy phân công. Thời gian chạy và ghi chú chưa có trong ảnh nguồn nên đang để “—”.</div>
        ${!currentProducts.length ? `<div class="notice">Chưa có kế hoạch sản xuất để gán sản phẩm cho máy; danh sách linh kiện theo từng máy vẫn hiển thị.</div>` : ""}`;
      renderShell(body);
    }
    function allocateMachine(number, product) {
      const key = `CNC-${number}`;
      if (product) state.allocations[key] = product;
      else delete state.allocations[key];
      saveState();
      showToast(product ? `Đã phân bổ ${product} cho máy CNC-${String(number).padStart(2, "0")}.` : `Đã bỏ phân bổ máy CNC-${String(number).padStart(2, "0")}.`);
    }
    function navigate(view) {
      currentView = view;
      if (view === "dashboard") renderDashboard();
      else if (view === "plans") renderPlans();
      else if (view === "inventory") renderInventory();
      else if (view === "products") renderProducts();
      else if (view === "machines") renderMachines();
      else if (view === "access" && currentUser?.role === "admin") renderAccessManagement();
      else renderDashboard();
    }
    function showToast(message) {
      const root = document.getElementById("toast-root");
      root.innerHTML = `<div class="toast"><span class="status-dot"></span>${escapeHtml(message)}</div>`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2800);
    }
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });
    window.addEventListener("beforeunload", event => {
      if (Object.keys(pendingPlanEdits).length) {
        event.preventDefault();
        event.returnValue = "";
      }
    });
    initializeDatabase();
  </script>
</body>
</html>
